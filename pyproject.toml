[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yukino-core"
version = "0.11.0"
description = "Configurable asynchronous OneBot kernel with multiple model providers and an administration console"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.12,<4", "Pillow>=12.3,<13"]

[project.urls]
Homepage = "https://github.com/Le672/yukino-core"
Documentation = "https://github.com/Le672/yukino-core/blob/main/docs/QUICKSTART.md"
Issues = "https://github.com/Le672/yukino-core/issues"

[project.scripts]
yukino-core = "yukino_core.__main__:main"

[tool.setuptools.packages.find]
include = ["yukino_core*"]

[tool.setuptools.package-data]
yukino_core = ["static/*", "resources/*", "plugins/*"]
