[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yukino-qq-desktop"
version = "0.1.0a1"
description = "Experimental OneBot text adapter for the visible official Linux QQ desktop"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.12,<4"]
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["qq_desktop*"]
